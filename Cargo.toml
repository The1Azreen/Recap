[package]
name = "recap"
version = "0.1.0"
edition = "2021"
description = "Recap - turn YouTube links, audio and video into timestamped transcripts and summaries"
repository = "https://github.com/The1Azreen/Recap"

[[bin]]
name = "recap"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.31"
rodio = { version = "0.20", default-features = false }
symphonia = { version = "0.5", features = ["all"] }
ureq = { version = "2.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
memmap2 = "0.9"
unicode-bidi = "0.3"
ar-reshaper = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Audio decoding in debug builds is painfully slow without this.
[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
